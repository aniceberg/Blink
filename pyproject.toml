[project]
name = "blink"
version = "1.0.3"
description = "Historical UniFi Protect timelapse generator"
requires-python = ">=3.14"
dependencies = [
  "aiofiles>=25.1.0",
  "fastapi>=0.141.1",
  "httpx>=0.28.1",
  "importlib-resources>=7.1.0",
  "jinja2>=3.1.6",
  "pydantic>=2.13.5",
  "python-multipart>=0.0.32",
  "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.13.1",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
]
macos = [
  "pyinstaller>=6.22.3",
  "pywebview>=6.2.1",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
